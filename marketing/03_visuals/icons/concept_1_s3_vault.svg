<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Squircle Border Glow -->
    <linearGradient id="borderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- S3 Bucket / Cube Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Sync Orange / Amber Energy Core -->
    <linearGradient id="amberCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f97316" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad1)" />
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="url(#borderGrad1)" stroke-width="3" />

  <!-- Main Symbol: S3 Storage Cube & Cloud Portal (Bold, Solid Geometry) -->
  <g filter="url(#dropShadow)">
    <!-- Isometric Cube / S3 Vault Base -->
    <!-- Top Face -->
    <polygon points="256,150 376,215 256,280 136,215" fill="url(#topFace)" />
    
    <!-- Left Face -->
    <polygon points="136,215 256,280 256,400 136,335" fill="url(#leftFace)" />
    
    <!-- Right Face -->
    <polygon points="256,280 376,215 376,335 256,400" fill="url(#rightFace)" />

    <!-- Accent: Front Center Seam Glow -->
    <line x1="256" y1="280" x2="256" y2="400" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    
    <!-- Bold Cloud Management Symbol floating atop / integrated into the storage cube -->
    <!-- Outer Cloud Glow Silhouette -->
    <path d="M 215 190 
             C 200 190 185 178 185 160 
             C 185 142 200 130 216 130 
             C 224 108 248 95 272 95 
             C 300 95 323 112 329 135 
             C 346 137 358 150 358 165 
             C 358 182 344 195 326 195 
             Z" 
          fill="url(#cloudGrad)" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Management / Sync Indicator in the Center of the Cube (Amber Energy Core) -->
    <circle cx="256" cy="290" r="28" fill="url(#amberCore)" filter="url(#coreGlow)" />
    <!-- Bold Minimalist Up/Down Transfer Icon inside core -->
    <path d="M 256 274 L 263 283 L 259 283 L 259 292 L 253 292 L 253 283 L 249 283 Z 
             M 256 306 L 249 297 L 253 297 L 253 288 L 259 288 L 259 297 L 263 297 Z" 
          fill="#ffffff" />
  </g>
</svg>
