<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Squircle Border -->
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- S3 Bucket Gradients -->
    <linearGradient id="bucketLip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="bucketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="cloudMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="bucketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad2)" />
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="url(#borderGrad2)" stroke-width="3" />

  <!-- Iconic S3 Cloud Bucket -->
  <g filter="url(#bucketGlow)">
    <!-- Top Floating Cloud Crest -->
    <path d="M 210 160 
             C 190 160 172 144 172 124 
             C 172 104 190 88 210 88 
             C 220 62 250 48 278 48 
             C 312 48 338 68 346 96 
             C 366 98 382 114 382 134 
             C 382 154 366 170 344 170 
             Z" 
          fill="url(#cloudMain)" />

    <!-- Bucket Rim Ring (Top Ellipse) -->
    <ellipse cx="256" cy="180" rx="140" ry="32" fill="url(#bucketLip)" />
    <ellipse cx="256" cy="178" rx="126" ry="24" fill="#0f172a" />

    <!-- Bucket Main Body -->
    <path d="M 120 184 
             L 148 360 
             C 152 400 360 400 364 360 
             L 392 184 
             C 370 210 142 210 120 184 Z" 
          fill="url(#bucketBody)" 
          stroke="#0284c7" 
          stroke-width="3" />

    <!-- Storage Level Ribs (Horizontal Clean Segment Lines) -->
    <path d="M 132 250 C 180 278 332 278 380 250" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <path d="M 142 316 C 180 342 332 342 370 316" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.4" />

    <!-- Center Control / Transfer Symbol (Bold Cloud Arrow) -->
    <g transform="translate(256, 280)">
      <circle cx="0" cy="0" r="38" fill="#0284c7" stroke="#38bdf8" stroke-width="4" />
      <!-- Cloud symbol cutout with up/down indicator -->
      <path d="M -14 -4 C -22 -4 -26 -10 -22 -16 C -20 -24 -6 -24 -2 -18 C 2 -24 18 -22 18 -14 C 24 -14 24 -4 16 -4 Z" fill="#ffffff" />
      <path d="M 0 -2 L 0 16 M -6 10 L 0 16 L 6 10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
