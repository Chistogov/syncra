<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Squircle Border -->
    <linearGradient id="borderGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Disc Gradients -->
    <linearGradient id="discTop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="discBody1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="discTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="discBody2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="discTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="discBody3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <linearGradient id="cloudWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Filter -->
    <filter id="stackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad3)" />
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="url(#borderGrad3)" stroke-width="3" />

  <g filter="url(#stackGlow)">
    <!-- Bottom Disc (Tier 3 Storage) -->
    <g transform="translate(0, 110)">
      <path d="M 120 220 C 120 248 181 270 256 270 C 331 270 392 248 392 220 L 392 246 C 392 274 331 296 256 296 C 181 296 120 274 120 246 Z" fill="url(#discBody3)" />
      <ellipse cx="256" cy="220" rx="136" ry="46" fill="url(#discTop3)" />
    </g>

    <!-- Middle Disc (Tier 2 Storage) -->
    <g transform="translate(0, 50)">
      <path d="M 120 200 C 120 228 181 250 256 250 C 331 250 392 228 392 200 L 392 226 C 392 254 331 276 256 276 C 181 276 120 254 120 226 Z" fill="url(#discBody2)" />
      <ellipse cx="256" cy="200" rx="136" ry="46" fill="url(#discTop2)" />
    </g>

    <!-- Top Disc (Active Storage / In-Memory Tier) -->
    <g transform="translate(0, -10)">
      <path d="M 120 180 C 120 208 181 230 256 230 C 331 230 392 208 392 180 L 392 206 C 392 234 331 256 256 256 C 181 256 120 234 120 206 Z" fill="url(#discBody1)" />
      <ellipse cx="256" cy="180" rx="136" ry="46" fill="url(#discTop1)" />
    </g>

    <!-- Floating Cloud Node (The S3 Orchestration Cloud) -->
    <path d="M 200 135 
             C 176 135 158 116 158 92 
             C 158 70 174 52 196 50 
             C 208 26 234 10 264 10 
             C 300 10 330 32 338 64 
             C 358 66 374 84 374 106 
             C 374 128 356 146 332 146 
             L 200 146 
             Z" 
          fill="url(#cloudWhite)" 
          stroke="#38bdf8" 
          stroke-width="5" />

    <!-- Center Lightning / Fast Transfer Bolt inside cloud -->
    <polygon points="264,44 246,84 262,84 252,122 282,74 266,74" fill="#0284c7" />
  </g>
</svg>
