<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient strictly matching Landing Reference -->
    <linearGradient id="landingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="50%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Ambient Aurora Glow Filter -->
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b101d" stop-opacity="0" />
    </radialGradient>

    <!-- Glassmorphic Border with 1px Glow -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <!-- Fluid Ribbon Main Gradient (Mint -> Cyan -> Royal Blue) -->
    <linearGradient id="fluidRibbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="fluidRibbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Container Squircle with Ambient Aura -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#landingBg)" />
  <circle cx="256" cy="256" r="210" fill="url(#auroraGlow)" />
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="url(#glassBorder)" stroke-width="2.5" />

  <!-- Fluid 'S' + Cloud Ribbon Symbol (Matching the Synaptix Logo & UI lines) -->
  <g filter="url(#neonBloom)">
    <!-- Back Loop of the Fluid Ribbon (S3 Storage Base) -->
    <path d="M 276 348 
             C 334 348 376 312 376 266 
             C 376 220 336 196 288 184 
             L 242 172 
             C 214 164 196 150 196 132 
             C 196 112 216 98 248 98 
             C 278 98 306 112 318 126" 
          fill="none" 
          stroke="url(#fluidRibbon2)" 
          stroke-width="48" 
          stroke-linecap="round" 
          opacity="0.75" />

    <!-- Front Luminous Fluid S3 Cloud Ribbon -->
    <path d="M 194 126 
             C 182 112 210 98 248 98 
             C 292 98 328 120 328 152 
             C 328 184 296 206 244 220 
             L 204 230 
             C 152 244 120 274 120 318 
             C 120 368 174 404 252 404 
             C 316 404 366 372 384 340" 
          fill="none" 
          stroke="url(#fluidRibbon1)" 
          stroke-width="50" 
          stroke-linecap="round" />

    <!-- Cloud management center glyph (Minimalist glowing node) -->
    <circle cx="288" cy="184" r="14" fill="#ffffff" />
    <circle cx="288" cy="184" r="26" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.8" />
  </g>
</svg>
